name: Release

# Tag-triggered only, deliberately. A workflow_dispatch run from a branch would
# publish `:latest` — which the compose file pins — from a commit whose build
# provenance subject is `@refs/heads/...`, not `@refs/tags/...`. Any admission
# policy pinned to the tag subject would then reject the image that consumers
# are actually pulling. One trigger, one subject shape, no surprises.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The image is only worth publishing if the code is green. Re-run the suite
  # here rather than trusting that the tagged commit passed CI on a branch.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npx vitest run
        working-directory: web

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless signing
      attestations: write    # build provenance
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/poketokenweb
          # `latest` comes from the tag flavour (default latest=auto), not from
          # a branch rule — on a tag push a `type=raw,enable={{is_default_branch}}`
          # entry never fires, which previously made the mechanism look
          # intentional while `latest` was actually published by accident.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Nothing here is arch-specific: pure Python plus musl wheels for the
          # apprise dependency chain. arm64 matters for Raspberry Pi and Apple
          # Silicon, both plausible hosts for a self-hosted toy.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.pushed_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      # Publishes an in-toto SLSA provenance statement as an OCI referrer.
      # Verify with:
      #   gh attestation verify oci://ghcr.io/sharkusmanch/poketokenweb:vX.Y.Z \
      #     --owner sharkusmanch
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/poketokenweb
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
