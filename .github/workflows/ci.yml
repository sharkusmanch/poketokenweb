name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # hashFiles() is a workspace function and is not available in a job-level
  # `if:` -- using it there makes the whole workflow fail to start, with zero
  # jobs and no annotation to explain why. Detect in a step instead and gate the
  # optional jobs on this output.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f web/package-lock.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # apprise is a real runtime dependency; without it every test that imports
      # poketokenweb.notify (directly or via runner/__main__) fails to collect.
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Engine drift vs the upstream port
        continue-on-error: true
        run: |
          git remote add port https://github.com/rubensanchezrivero/poketokenbar-plasma || true
          git fetch --quiet port main
          {
            echo '### Engine drift vs rubensanchezrivero/poketokenbar-plasma'
            echo '```'
            git diff --stat port/main -- poketokenbar/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web

  image:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds without pushing: a broken Dockerfile fails the PR rather than
      # the release tag, where the only signal would be a failed publish.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: poketokenweb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must start, serve, and stop cleanly
        run: |
          docker run -d --name ptw -p 18080:8080 -e HOME=/config -e TZ=UTC poketokenweb:ci
          for _ in $(seq 1 60); do
            if curl -sf localhost:18080/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -sf localhost:18080/healthz
          curl -sf localhost:18080/api/config
          # Exercises the entrypoint's signal path end to end: a handler that
          # deadlocks would hit the stop timeout and fail here.
          timeout 30 docker stop ptw
          test "$(docker inspect -f '{{.State.ExitCode}}' ptw)" = "0"
      - name: Container logs
        if: always()
        run: docker logs ptw || true
