services:
  poketokenweb:
    image: ghcr.io/sharkusmanch/poketokenweb:latest
    container_name: poketokenweb
    # Bound to loopback on purpose: this app has NO authentication of its own.
    # Change to "8080:8080" only behind a reverse proxy that provides auth.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Usage is bucketed by LOCAL date, so this genuinely matters.
      TZ: ${TZ:-UTC}
      # Where the app looks for .claude/, .codex/ and .claude.json
      HOME: /config
      # Optional. Any Apprise URI, comma-separated for several:
      #   discord://webhook_id/webhook_token
      #   ntfy://ntfy.sh/your-topic
      #   pover://user@token
      #   apprise://your-apprise-server:8000/your-key
      # Unset disables notifications.
      APPRISE_URLS: ${APPRISE_URLS:-}
      # Extra transcript dirs to scan, ':'-separated. CONTAINER paths -- pair
      # each one with a read-only volume below. Unset scans nothing extra.
      POKETOKENWEB_CLAUDE_PROJECT_ROOTS: ${POKETOKENWEB_CLAUDE_PROJECT_ROOTS:-}
    volumes:
      # Your usage logs, READ-ONLY. The app never writes here.
      - ${CLAUDE_HOME:-${HOME}}/.claude:/config/.claude:ro
      # Which account the official limits belong to. Optional: comment out if
      # you do not have this file, or Docker will create a directory in its
      # place. It is a FILE at the root of your home, not inside .claude/.
      - ${CLAUDE_HOME:-${HOME}}/.claude.json:/config/.claude.json:ro
      # Codex usage. Comment out if you do not use Codex.
      - ${CLAUDE_HOME:-${HOME}}/.codex:/config/.codex:ro
      # Transcripts from another machine, READ-ONLY. The path on the RIGHT is
      # what POKETOKENWEB_CLAUDE_PROJECT_ROOTS must name.
      # - /mnt/other-machine/.claude/projects:/config/extra/other-machine:ro
      # Companion save, settings, sprite cache, scan cache.
      - poketokenweb-data:/data
    # The image runs as 1000:1000. If your logs are owned by a different user,
    # set PUID/PGID in .env — `id -u` and `id -g` will tell you.
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped

volumes:
  poketokenweb-data:
